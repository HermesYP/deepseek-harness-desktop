[[permission]]
identifier = "bridge"
description = "Allows the preserved client bridge to call only its declared desktop commands."
commands.allow = [
  "guest_browser_acquire",
  "guest_browser_release",
  "guest_browser_set_bounds",
  "guest_browser_navigate",
  "guest_browser_command",
  "guest_browser_state",
  "guest_platform_status",
  "guest_platform_open",
  "guest_platform_set_bounds",
  "guest_platform_close",
  "shell_host_paths",
  "shell_host_paths_consume",
  "shell_caption_menu",
  "shell_caption_palette",
  "shell_renderer_console",
  "credential_delete",
  "credential_has",
  "credential_list",
  "credential_store",
  "runtime_boot_failed",
  "runtime_boot_ready",
  "runtime_quit_inspection",
  "runtime_restart",
  "runtime_status",
  "shell_appearance",
  "shell_clipboard_read",
  "shell_clipboard_write",
  "shell_locale_set",
  "shell_menu_action",
  "shell_open_external",
  "shell_quit_request",
  "shell_window_set_fullscreen",
  "shell_window_chrome_action",
  "shell_window_resize_dragging",
  "shell_window_toggle_devtools",
  "settings_get",
  "settings_list",
  "settings_reset",
  "settings_set",
  "shell_app_info",
  "shell_close_window",
  "shell_locale_apply",
  "shell_locale_get",
  "shell_onboarding_set_active",
  "shell_pick_directory",
  "shell_shortcuts_edit",
  "shell_shortcuts_get",
  "shell_shortcuts_recording",
  "shell_theme_set",
  "update_check",
  "update_open",
  "update_status",
]

[[permission]]
identifier = "policy-surface"
description = "Allows only the isolated local mandatory-policy presentation and actions."
commands.allow = ["policy_presented", "policy_retry", "policy_update", "policy_quit"]
