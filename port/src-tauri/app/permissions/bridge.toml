[[permission]]
identifier = "bridge"
description = "Allows the preserved client bridge to call only its declared desktop commands."
commands.allow = [
  "credential_delete",
  "credential_has",
  "credential_list",
  "credential_store",
  "runtime_boot_failed",
  "runtime_boot_ready",
  "runtime_quit_inspection",
  "runtime_restart",
  "runtime_status",
  "shell_appearance",
  "shell_clipboard_read",
  "shell_clipboard_write",
  "shell_locale_set",
  "shell_menu_action",
  "shell_open_external",
  "shell_quit_request",
  "shell_window_set_fullscreen",
  "shell_window_chrome_action",
  "shell_window_toggle_devtools",
  "settings_get",
  "settings_list",
  "settings_reset",
  "settings_set",
  "shell_app_info",
  "shell_close_window",
  "shell_locale_apply",
  "shell_locale_get",
  "shell_onboarding_set_active",
  "shell_pick_directory",
  "shell_shortcuts_edit",
  "shell_shortcuts_get",
  "shell_shortcuts_recording",
  "shell_theme_set",
  "update_check",
  "update_open",
  "update_status",
]
