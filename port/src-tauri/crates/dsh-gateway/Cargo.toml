[package]
name = "dsh-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Authenticated loopback HTTP + WebSocket application gateway for the DeepSeek Harness desktop port."

[dependencies]
dsh-core = { path = "../dsh-core" }
axum = { workspace = true }
base64 = { workspace = true }
bytes = "1"
chrono = { workspace = true }
futures-util = { workspace = true }
http-body-util = "0.1"
getrandom = { workspace = true }
hmac = { workspace = true }
mime_guess = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Load-generation harness for same-machine reference/port comparison (LANE 9 of
# port/scripts/benchmark.ps1). Kept behind a feature so an ordinary `cargo test`
# never builds or runs a benchmark binary, and so the harness cannot be mistaken
# for a product entry point.
[[bin]]
name = "gateway-benchmark"
path = "src/bin/gateway_benchmark.rs"
required-features = ["benchmark-harness"]

[features]
benchmark-harness = []
